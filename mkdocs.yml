site_name: QNX Learnings
site_description: Personal notes and learnings about QNX
site_url: https://sivaram91.github.io/QNX_Learnings/
repo_url: https://github.com/Sivaram91/QNX_Learnings
repo_name: Sivaram91/QNX_Learnings
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Raspberry Pi:
    - raspberry-pi/index.md
    - Host setup: raspberry-pi/host-setup.md
    - Flash and first boot: raspberry-pi/flashing.md
    - WiFi: raspberry-pi/wifi.md
    - Security and SSH: raspberry-pi/security-ssh.md
    - Build and run: raspberry-pi/build-run.md
